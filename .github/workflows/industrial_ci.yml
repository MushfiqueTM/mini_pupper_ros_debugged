name: industrial_ci

on:
  push:
    paths-ignore:
    - '**.md'
  pull_request:
    paths-ignore:
    - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_WORKSPACE: .minipupper.repos
  ROSDEP_SKIP_KEYS: champ_base champ_teleop champ_description champ_gazebo ldlidar_node ldlidar_stl_ros2 gazebo_plugins gazebo_ros gazebo_ros_pkgs gazebo_ros2_control velodyne_gazebo_plugins ecl_threads
  # Remove broken champ packages BEFORE rosdep runs, so their deps aren't resolved
  BEFORE_INSTALL_UPSTREAM_DEPENDENCIES: 'for p in champ_gazebo champ_description champ_bringup champ_navigation champ_config; do find / -maxdepth 10 -type d -name "$p" -path "*/champ/*" -exec sh -c "touch \"{}/COLCON_IGNORE\"; rm -f \"{}/package.xml\"" \; 2>/dev/null; done; true'

jobs:
  industrial_ci:
    strategy:
      matrix:
        env:
          - { ROS_DISTRO: jazzy, ROS_REPO: ros }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: "ros-industrial/industrial_ci@master"
        env: ${{ matrix.env }}
