footprint_to_odom_ekf:
  ros__parameters:
    frequency: 5.0
    publish_tf: true
    transform_timeout: 0.1
    # transform_time_offset: 0.05
    two_d_mode: true

    #x     , y     , z,
    #roll  , pitch , yaw,
    #vx    , vy    , vz,
    #vroll , vpitch, vyaw,
    #ax    , ay    , az

    odom0: odom/raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    # imu0 disabled: Mini Pupper 1 has no IMU
    #imu0: imu/data
    #imu0_config: [false, false, false,
    #              false, false, true,
    #              false, false, false,
    #              false, false, true,
    #              false, false, false]

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
