base_to_footprint_ekf:
  ros__parameters:
    frequency: 20.0
    publish_tf: true
    transform_timeout: 0.1
    transform_time_offset: 0.045
    two_d_mode: false

    #x     , y     , z,
    #roll  , pitch , yaw,
    #vx    , vy    , vz,
    #vroll , vpitch, vyaw,
    #ax    , ay    , az

    pose0: base_to_footprint_pose
    pose0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    # Mini Pupper 1 has no IMU
    # imu0: imu/data

    odom_frame: base_footprint
    world_frame: base_footprint
