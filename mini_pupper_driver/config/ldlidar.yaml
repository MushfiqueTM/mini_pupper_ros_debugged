# LiDAR configuration for Mini Pupper (LD06)
# This file is loaded by lidar_ld06.launch.py and overrides the upstream
# ldrobot-lidar-ros2 defaults to match Mini Pupper's hardware.

/**:
  ros__parameters:
    general:
      debug_mode: false

    comm:
      serial_port: '/dev/ldlidar'
      baudrate: 230400
      timeout_msec: 1000

    lidar:
      model: 'LDLiDAR_LD06'
      rot_verse: 'CCW'
      units: 'M'
      frame_id: 'lidar_link'
      bins: 455
      range_min: 0.03
      range_max: 15.0
      enable_angle_crop: false
      angle_crop_min: 90.0
      angle_crop_max: 270.0
